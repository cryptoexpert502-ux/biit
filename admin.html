<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex,nofollow">
<title>Admin Panel — BIIT Computer Institute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10241c;--board:#0f3d2e;--board2:#1b5e46;--chalk:#f3f6ef;--paper:#fff;--line:#dbe4dc;
  --gold:#f2c94c;--ok:#168a56;--bad:#c0392b;--warn:#c98a00;--mute:#5d6e66;
  --head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 var(--body);color:var(--ink);background-color:var(--chalk);
  background-image:radial-gradient(#d3dfd5 1px,transparent 1px);background-size:22px 22px}
h1,h2{font-family:var(--head);margin:0 0 .6rem;letter-spacing:-.01em}
h2{font-size:1.3rem;font-weight:800}
.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--board),var(--board2));box-shadow:0 6px 18px -10px rgba(0,0,0,.5)}
header{color:#fff;padding:.75rem 1rem;display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.brand{display:flex;align-items:center;gap:.6rem}
.logo-mark{background:#fff!important;overflow:hidden;padding:0;border-radius:50%!important;box-shadow:0 2px 8px rgba(0,0,0,.18)!important}.logo-mark img{border-radius:0!important}.logo-mark img{width:100%;height:100%;object-fit:contain;border-radius:inherit}.mark{width:52px;height:52px;border-radius:10px;background:var(--gold);color:var(--board);display:grid;place-items:center;font:800 1.15rem var(--head)}
header h1{font-size:1.05rem;margin:0;font-weight:800}
header small{display:block;color:#bcd8cb;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;gap:.35rem;overflow-x:auto;padding:0 .7rem .65rem;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:rgba(255,255,255,.08);border:0;color:#d5e8de;padding:.45rem .95rem;border-radius:999px;white-space:nowrap;font:500 .92rem var(--body);cursor:pointer}
nav button.on{background:var(--gold);color:var(--board);font-weight:700}
main{padding:1rem;max-width:760px;margin:auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:1rem;margin-bottom:.8rem;box-shadow:0 10px 24px -16px rgba(15,61,46,.45)}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:.65rem .75rem;border:1.5px solid var(--line);border-radius:12px;margin:.25rem 0 .6rem;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--board2);box-shadow:0 0 0 3px rgba(27,94,70,.15)}
.btn{background:var(--board);color:#fff;border:0;border-radius:12px;padding:.65rem 1.05rem;cursor:pointer;font-weight:700}
.btn:active{transform:scale(.98)}
.btn.sm{padding:.35rem .75rem;font-size:.85rem;border-radius:10px}
.btn.alt{background:#fff;color:var(--board);border:1.5px solid var(--board)}
.btn.red{background:var(--bad)}
.btn.wa{background:#1fae54;color:#fff}
.btn.big{width:100%;padding:.85rem;font-size:1rem}
.btns{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.2rem}
.link{background:none;border:0;color:var(--board2);text-decoration:underline;padding:.5rem 0;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;margin-bottom:.8rem}
.grid .card{margin:0}
.stat{padding:.8rem .75rem;border-top:4px solid var(--board2);font-size:.82rem;color:var(--mute)}
.stat.ok{border-top-color:var(--ok)}.stat.bad{border-top-color:var(--bad)}
.stat b{display:block;font:800 1.9rem var(--head);color:var(--ink);line-height:1.1}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-top:.4rem}
.g3 div{background:var(--chalk);border-radius:10px;padding:.45rem .55rem;font-size:.78rem;color:var(--mute)}
.g3 b{display:block;font-size:1rem;color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.muted{color:var(--mute);font-size:.88rem}
.p{color:var(--ok)!important}.a{color:var(--bad)!important}.w{color:var(--warn)!important}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:.35rem .75rem;margin-left:.25rem;cursor:pointer;font-weight:700}
.seg button.P.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.seg button.A.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.seg button.L.on{background:var(--warn);color:#fff;border-color:var(--warn)}
.chip{display:inline-block;border-radius:999px;padding:.12rem .65rem;font-size:.75rem;font-weight:700;color:#fff;text-transform:capitalize}
.chip.present{background:var(--ok)}.chip.absent{background:var(--bad)}.chip.leave{background:var(--warn)}
.hide{display:none!important}
.box{max-width:390px;margin:10vh auto}
.box .mark{margin:0 auto .6rem;width:120px;height:120px;font-size:1.5rem;padding:0;border-radius:50%}
.box h2{text-align:center}
#msg{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.65rem 1.1rem;border-radius:12px;display:none;max-width:90%;z-index:99}
.hist-row{display:flex;justify-content:space-between;gap:.5rem;padding:.4rem 0;border-bottom:1px dashed var(--line);font-size:.88rem}
.hist-row:last-child{border-bottom:0}
.note{background:#fff8dc;border:1px solid #efdc95;border-radius:10px;padding:.45rem .7rem;font-size:.82rem;color:#6b5a10;margin-bottom:.7rem}
.msgcard{border-left:4px solid var(--gold)}
/* WhatsApp sheet */
.sheet{position:fixed;inset:0;background:rgba(8,28,20,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:1rem 1rem 1.2rem}
.bar{height:8px;background:var(--chalk);border-radius:99px;overflow:hidden;margin:.6rem 0 .8rem}
.bar i{display:block;height:100%;width:0;background:#1fae54;transition:width .3s}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.5rem 0;border-bottom:1px dashed var(--line)}
.wrow:last-child{border-bottom:0}
.wrow.done .nm{color:var(--mute);text-decoration:line-through}
.tick{color:#1fae54;font-weight:700}
.credit{text-align:center;font-size:.72rem;color:#5d6e66;padding:1.2rem 1rem 1.6rem;opacity:.85}
.atiles{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.atile{border:0;border-radius:16px;padding:1.1rem .9rem;color:#fff;text-align:left;cursor:pointer;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 18px -10px rgba(0,0,0,.5);font-family:inherit}
.atile .ai{font-size:2.1rem;text-align:center}.atile .an{font-size:1.05rem;font-weight:800;text-align:center}.atile .ac{font-size:1.6rem;font-weight:800;text-align:center}

:root{--ink:#1e1236;--board:#3b1f7a;--board2:#7a45d6;--chalk:#f6f2fd;--line:#e1d8f1;--gold:#ffb703;--mute:#6a5f85}
body{background-image:radial-gradient(#ddd2f1 1px,transparent 1px)}
.card{border-top:4px solid var(--board2);box-shadow:0 12px 26px -16px rgba(59,31,122,.55)}
.btn{background:linear-gradient(135deg,var(--board),var(--board2))}
.btn.red{background:linear-gradient(135deg,#b3261e,#e5484d)}.btn.alt{background:#fff;color:var(--board);border:1.5px solid var(--board2)}
header{background:linear-gradient(135deg,#2b1055,#6a3fc8 70%,#8e5bf0)}
h2{background:linear-gradient(90deg,var(--board),var(--board2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* bigger boxes for colour + edit-profile */
.bigbox{padding:1.4rem 1.2rem;border-radius:20px}
.bigbox input,.bigbox select{padding:.95rem 1rem;font-size:1.05rem;min-height:52px;border-radius:14px}
.bigbox label{font-size:.95rem;font-weight:600;display:block;margin-top:.5rem}
.bigbox .btn{padding:.9rem 1.2rem;font-size:1.05rem;min-height:50px}
.colrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.7rem}
.colrow input[type=color]{height:64px;padding:4px;cursor:pointer}
.swatches{display:flex;flex-wrap:wrap;gap:.6rem;margin:.6rem 0}
.swatch{width:54px;height:54px;border-radius:14px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;overflow:auto;padding:1rem;display:flex;align-items:flex-start;justify-content:center}
.modal .card{width:100%;max-width:640px;margin:1rem auto}

<style id="biit-admin-studio">
/* BIIT Admin Studio - visual only (logic unchanged) */
:root{--ink:#0f172a;--mute:#64748b;--navy:#0b1437;--indigo:#4338ca;--violet:#7c3aed;--pink:#ec4899;--gold:#fbbf24;--glass:rgba(255,255,255,.82);--line:#e2e8f0}
body{background:
 radial-gradient(900px 500px at -10% -10%,rgba(124,58,237,.16),transparent 60%),
 radial-gradient(800px 480px at 110% 0%,rgba(236,72,153,.13),transparent 60%),
 linear-gradient(180deg,#f8fafc,#f1f5ff)!important;background-image:none!important;color:var(--ink)}
.top{background:linear-gradient(100deg,#0b1437 0%,#2a1a8c 52%,#b5179e 100%)!important;box-shadow:0 18px 40px -18px rgba(11,20,55,.7)!important;border-bottom:1px solid rgba(255,255,255,.08)}
header{padding:14px 18px 6px!important}
header .brand,.brand{color:#fff}
.brand b,.brand strong,.brand .name{font-family:var(--head);letter-spacing:.2px}
.mark img{border:3px solid #fff;box-shadow:0 8px 22px rgba(0,0,0,.35)!important}
#nav{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 14px}
#nav button{background:rgba(255,255,255,.12)!important;color:#fff!important;border:1px solid rgba(255,255,255,.22)!important;border-radius:999px!important;padding:8px 14px!important;font-weight:700;backdrop-filter:blur(6px)}
#nav button.on{background:#fff!important;color:#2a1a8c!important;border-color:#fff!important;box-shadow:0 8px 22px -8px rgba(0,0,0,.45)}
h1,h2,h3{font-family:var(--head);color:#1e1b4b;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:800;position:relative;padding-bottom:.4rem}
h2:after{content:"";display:block;width:56px;height:4px;border-radius:9px;margin-top:.45rem;background:linear-gradient(90deg,var(--violet),var(--pink),var(--gold))}
.card,.box,.panel{background:var(--glass)!important;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9)!important;border-radius:24px!important;box-shadow:0 18px 40px -22px rgba(30,27,75,.35),0 2px 6px rgba(30,27,75,.05)!important;padding:18px!important;margin-bottom:16px}
.btn,button.btn{background:linear-gradient(120deg,#4338ca,#7c3aed 55%,#db2777)!important;color:#fff!important;border:0!important;border-radius:14px!important;font-weight:750;box-shadow:0 10px 22px -10px rgba(124,58,237,.7);transition:transform .15s ease,filter .15s ease}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn.alt{background:#fff!important;color:#4338ca!important;border:2px solid #c4b5fd!important;box-shadow:none}
.btn.red{background:linear-gradient(120deg,#dc2626,#f43f5e)!important}
.btn.green{background:linear-gradient(120deg,#059669,#10b981)!important}
input,select,textarea{border:1.5px solid #dbe3f0!important;border-radius:14px!important;background:#fff!important;padding:11px 13px!important;font:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#7c3aed!important;box-shadow:0 0 0 4px rgba(124,58,237,.14)!important}
label{color:var(--mute);font-weight:600}
table{border-collapse:separate;border-spacing:0;width:100%;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 10px 24px -18px rgba(30,27,75,.4)}

tr:hover td{background:#faf5ff}
.atiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin:8px 0 18px}
.atile{position:relative;border:0!important;border-radius:22px!important;padding:16px!important;min-height:112px;color:#fff!important;text-align:left;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 16px 30px -16px rgba(15,23,42,.55);overflow:hidden;transition:transform .18s ease,box-shadow .18s ease}
.atile:before{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.16)}

// ---- If Supabase blocks a save with a row-level-security error, retry it through the admin_write function ----
(function(){
  const TABLES=new Set(['exam_blocks','attendance_settings','site_settings','exam_questions','exams','exam_attempts','discounts','library_fee_payments','library_courses','library_registrations','promoters','promoter_commissions','courses','students','fee_payments','site_media','push_log','library_attendance','teacher_attendance','teacher_fee_records','teacher_registration_requests','attendance']);
  const WRITE=['insert','upsert','update','delete'];
  const isRls=e=>e&&/row-level security|permission denied|violates row/i.test(e.message||'');
  const origFrom=sb.from.bind(sb);
  function writer(t,op,args){
    const calls=[];
    const shimObj=new Proxy({},{get(_,prop){
      if(prop==='then')return (res,rej)=>run().then(res,rej);
      return (...a)=>{calls.push([prop,a]);return shimObj};
    }});
    async function run(){
      let b=origFrom(t)[op](...args);
      for(const [m,a] of calls)b=b[m](...a);
      const r=await b;
      if(!r.error||!isRls(r.error))return r;
      const filters=[];let one=false;
      for(const [m,a] of calls){
        if(m==='eq')filters.push({op:'eq',col:a[0],val:String(a[1])});
        else if(m==='in')filters.push({op:'in',col:a[0],val:a[1].map(String)});
        else if(m==='single'||m==='maybeSingle')one=true;
      }
      const conflict=op==='upsert'?((args[1]&&args[1].onConflict)||null):null;
      const x=await sb.rpc('admin_write',{p_table:t,p_op:op,p_data:args[0]===undefined?null:args[0],p_filters:filters,p_conflict:conflict});
      if(x.error){
        if(/admin_write/i.test(x.error.message)&&/function|schema cache|find/i.test(x.error.message))
          return {data:null,error:{message:'Permission blocked this save. Run supabase_oct_update.sql once in Supabase > SQL Editor, then try again.'}};
        if(/Only admin or teacher/i.test(x.error.message||''))return {data:null,error:{message:'You are not logged in as admin in this browser right now (another tab may have logged in as a student). Log out and log in as admin again.'}};
        return {data:null,error:x.error};
      }
      const d=x.data||[];
      return {data:one?(d[0]||null):d,error:null};
    }
    return shimObj;
  }
  sb.from=function(t){
    const b=origFrom(t);
    if(!TABLES.has(t))return b;
    return new Proxy(b,{get(tg,prop){
      if(WRITE.includes(prop))return (...args)=>writer(t,prop,args);
      const v=tg[prop];return typeof v==='function'?v.bind(tg):v;
    }});
  };
})();

async function addCourse(){
  const n = $('#c-name').value.trim();
  const f = Number($('#c-fees').value || 0);
  if(!n) return toast('Enter a course name.');
  if(f < 0) return toast('Enter a valid fee amount.');
  // A deleted course is only hidden (is_active=false), so its name is still taken. Bring it back instead of failing.
  const esc_=n.replace(/[\\%_]/g,m=>'\\'+m);
  const ex = await sb.from('courses').select('id,name,is_active').ilike('name',esc_).limit(1);
  let r;
  if(!ex.error && ex.data && ex.data.length){
    if(ex.data[0].is_active!==false) return toast('A course named "'+ex.data[0].name+'" already exists.');
    r = await sb.from('courses').update({is_active:true,total_fees:f}).eq('id',ex.data[0].id).select('id');
    if(!r.error && (!r.data||!r.data.length)) return toast('Could not restore the old course (database permission). Run the courses SQL in Supabase.',8000);
  } else {
    r = await sb.from('courses').insert({name:n, total_fees:f});
  }
  if(r.error) return toast('Error: '+r.error.message);
  toast('Course saved.');
  $('#c-name').value=''; $('#c-fees').value='';
  go('crs');
}
async function delCourse(id){
  if(!confirm('Delete this course?')) return;
  const r=await sb.from('courses').update({is_active:false}).eq('id',id).select('id');
  if(r.error) return toast('Delete failed: '+r.error.message,6000);
  if(!r.data||!r.data.length) return toast('Delete blocked by database permission. Run the courses SQL in Supabase.',7000);
  toast('Course deleted.');go('crs');
}

// ===== GPS + face helpers =====
const distM=(a,b,c,d)=>{const R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const fmtDist=m=>m>=1000?(m/1000).toFixed(1)+' km':Math.round(m)+' m';
const _sleep=ms=>new Promise(r=>setTimeout(r,ms));
// best GPS fix within maxMs (keeps listening and uses the most accurate reading)
function getBestPosition(maxMs){
  return new Promise((res,rej)=>{
    let best=null,done=false,id=null,t=null;
    const fin=()=>{if(done)return;done=true;try{navigator.geolocation.clearWatch(id)}catch(_){}clearTimeout(t);best?res(best):rej({code:2})};
    id=navigator.geolocation.watchPosition(p=>{if(!best||p.coords.accuracy<best.coords.accuracy)best=p;if(p.coords.accuracy<=25)fin()},
      e=>{if(e.code===1&&!done){done=true;try{navigator.geolocation.clearWatch(id)}catch(_){}clearTimeout(t);rej(e)}},
      {enableHighAccuracy:true,maximumAge:0,timeout:maxMs});
    t=setTimeout(fin,maxMs);
  });
}
const FACE_SCRIPTS=['https://cdnjs.cloudflare.com/ajax/libs/face-api.js/0.22.2/face-api.min.js','https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js'];
const FACE_MODELS=['https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights','https://justadudewhohacks.github.io/face-api.js/models'];
const _loadScript=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('blocked or offline: '+src));document.head.appendChild(s)});
let _faceReady=null;
function loadFaceApi(){
  if(_faceReady)return _faceReady;
  _faceReady=(async()=>{
    if(!window.faceapi){
      let err;for(const u of FACE_SCRIPTS){try{await _loadScript(u);if(window.faceapi)break}catch(e){err=e}}
      if(!window.faceapi)throw new Error('Could not load the face engine ('+((err&&err.message)||'blocked')+'). Check the internet connection.');
    }
    let last;
    for(const U of FACE_MODELS){
      try{await faceapi.nets.tinyFaceDetector.loadFromUri(U);await faceapi.nets.faceLandmark68TinyNet.loadFromUri(U);await faceapi.nets.faceRecognitionNet.loadFromUri(U);return}
      catch(e){last=e}
    }
    throw new Error('Could not load the face models ('+((last&&last.message)||'network error')+'). Check the internet connection.');
  })().catch(e=>{_faceReady=null;throw e});
  return _faceReady;
}
// returns the averaged 128-number face code, or null (src = <video> or <img>)
async function faceDescriptorFrom(src,frames,ctl){
  ctl=ctl||{};const say=t=>{if(ctl.msg)ctl.msg(t)};
  const opts=new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.5});
  const ds=[];
  for(let i=0;i<80&&ds.length<frames;i++){
    if(ctl.cancel)return null;
    const all=await faceapi.detectAllFaces(src,opts).withFaceLandmarks(true).withFaceDescriptors();
    if(all.length>1){say('Only one face should be visible.');await _sleep(300);continue}
    if(all.length===1&&all[0].detection.score>=.6){
      const w=src.videoWidth||src.naturalWidth||src.width||1;
      if(all[0].detection.box.width/w<.18){say('Move a little closer to the camera.');await _sleep(300);continue}
      ds.push(Array.from(all[0].descriptor));say('Face captured '+ds.length+' / '+frames);
      if(ds.length<frames)await _sleep(450);continue;
    }
    say('Looking for the face… keep it inside the frame, in good light.');await _sleep(300);
  }
  if(ds.length<frames)return null;
  const m=new Array(128).fill(0);ds.forEach(d=>d.forEach((v,k)=>{m[k]+=v/ds.length}));
  return m.map(v=>Math.round(v*10000)/10000);
}

function saSetLoc(){
  if(!navigator.geolocation)return toast('This browser cannot share location.');
  toast('Getting your location…');
  navigator.geolocation.getCurrentPosition(p=>{
    if(p.coords.accuracy>60)return toast('GPS is not accurate enough ('+Math.round(p.coords.accuracy)+' m). Turn on GPS / high accuracy, go near a window and try again.',8000);
    window._saLoc={lat:p.coords.latitude,lng:p.coords.longitude};
    $('#sa-loc').textContent='New location ready ('+p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5)+', accuracy '+Math.round(p.coords.accuracy)+' m). Press Save.';
  },e=>toast(e.code===1?'Please allow location permission for this site.':'Could not get the location.',7000),{enableHighAccuracy:true,timeout:25000,maximumAge:0});
}
async function saTest(){
  const el=$('#sa-test'),L=window._saLoc||{};
  if(L.lat==null||L.lng==null)return toast('First set the institute location and press Save.');
  if(!navigator.geolocation)return toast('This browser cannot share location.');
  el.textContent='Getting a GPS fix (up to 15 seconds)…';
  try{
    const p=await getBestPosition(15000),acc=p.coords.accuracy,rad=Number($('#sa-rad').value);
    const d=distM(p.coords.latitude,p.coords.longitude,Number(L.lat),Number(L.lng)),inside=d<=rad;
    el.innerHTML='GPS accuracy: ±'+Math.round(acc)+' m<br>Distance from institute location: <b>'+fmtDist(d)+'</b><br>Allowed distance: '+rad+' m → <b style="color:'+(inside?'#168a56':'#c0392b')+'">'+(inside?'INSIDE ✓':'OUTSIDE ✗')+'</b>'+(acc>rad?'<br>⚠ GPS accuracy is worse than the allowed distance here, so results may be unreliable.':'');
  }catch(e){el.textContent=e&&e.code===1?'Location permission was denied for this site.':'Could not get a GPS fix. Turn on GPS and try again.'}
}
async function saSave(){

  const r = await sb.from('fee_payments').insert({

    paid_at: now.toISOString(),

    note: note

let WQ = {list:[]};

function waStart(list){
  WQ = {list:list.map(x=>({...x,done:false}))};
  $('#wa').classList.remove('hide');
  waRender();
  waNext();                       // the first chat opens immediately
}
function waOpen(k){
  const x = WQ.list[k];
  const w = window.open(waUrl(x.phone,x.msg),'_blank');
  if(!w) return toast('The browser blocked the new tab. Tap “Next” again.');
  x.done = true; waRender();
}
function waNext(){
  const k = WQ.list.findIndex(x=>!x.done);
  if(k<0) return waClose();
  waOpen(k);
}
function waClose(){ $('#wa').classList.add('hide'); }
function waRender(){
  const L = WQ.list, d = L.filter(x=>x.done).length;
  $('#wa-title').textContent = `WhatsApp: ${d}/${L.length} opened`;
  $('#wa-bar').style.width = (L.length? d*100/L.length : 0)+'%';
  const nx = L.find(x=>!x.done);
  $('#wa-next').textContent = nx ? `Next: ${nx.name} →` : 'All Done ✓ (Close)';
  $('#wa-list').innerHTML = L.map((x,k)=>`
    <div class="wrow ${x.done?'done':''}">
      <span><span class="nm"><b>${esc(x.name)}</b></span><br><span class="muted">${esc(x.phone)}</span></span>
      ${x.done?'<span class="tick">✓ Opened</span>':''}
      <button class="btn sm ${x.done?'alt':'wa'}" onclick="waOpen(${k})">${x.done?'Open Again':'Open WhatsApp'}</button>
    </div>`).join('');
}

const VAPID_PUBLIC_ADM=(document.documentElement.dataset.vapid||'')||'BA9Ce5_LU5HUO0SXCA1FEVVa7Bl7MC44GIBb9IMeiqu0GQWRuNUzTSKm2_HGRY3GLrvw2Mr6jzRZWfRf98qwCrg';
function b64ToU8Adm(b){const p='='.repeat((4-b.length%4)%4),r=(b+p).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(r);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
async function enablePushAdmin(){
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))return toast('This browser cannot show notifications.',8000);
    const perm=await Notification.requestPermission();
    if(perm!=='granted')return toast('Notifications are blocked. Allow them in the browser/site settings and try again.',8000);
    await navigator.serviceWorker.register('/sw.js');
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8Adm(VAPID_PUBLIC_ADM)});
    const j=sub.toJSON(),u=(await sb.auth.getUser()).data.user;
    const r=await sb.rpc('save_push_subscription',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});
    if(r.error)return toast('Could not save: '+(/save_push_subscription/i.test(r.error.message)?'run push_fix.sql in Supabase first.':r.error.message),9000);
    const b=document.querySelector('#adm-push');if(b)b.innerHTML='<span class="muted">🔔 Notifications are ON for this phone.</span>';
    toast('Notifications turned on.',5000);
  }catch(e){toast('Could not turn on notifications: '+(e.message||e),9000)}
}

async function sendMsg(withWA){
  const t = $('#mt').value.trim();
  if(!t) return toast('Enter a message first.');
  const cls = $('#mc').value;
  const list = students.filter(s=>s.phone && (!cls || s.class===cls));

  if(withWA){
    waStart(list.map(s=>({name:s.name, phone:s.phone, msg:`Hello ${s.name}, ${t}\n— BIIT Computer Institute`})));

async function toJpegBlob(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1000/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error('Photo could not be read')),'image/jpeg',.8)};img.onerror=()=>rej(new Error('Photo could not be read'));img.src=URL.createObjectURL(file)})}

async function renderPromoterReport(){const month=$('#pm')?.value;if(!month)return;const start=month+'-01',end=(()=>{let y=Number(month.slice(0,4)),m=Number(month.slice(5,7))+1;if(m>12){m=1;y++}return y+'-'+String(m).padStart(2,'0')+'-01'})(),tsA=start+'T00:00:00+05:30',tsB=end+'T00:00:00+05:30';{const _r=await sb.from('promoter_commissions').select('*').order('paid_at',{ascending:false});window._pc=_r.data||[];window._pcErr=_r.error}const [pr,st,pay]=await Promise.all([ok(sb.from('promoters').select('*').order('name')),ok(sb.from('students').select('id,name,class,phone,promoter_code,created_at').gte('created_at',tsA).lt('created_at',tsB)),ok(sb.from('fee_payments').select('student_id,amount,paid_at,paid_on').gte('paid_on',start).lt('paid_on',end)),ok(sb.from('students').select('id,name,class,phone,promoter_code,created_at').not('promoter_code','is',null)),ok(sb.from('fee_payments').select('student_id,amount,paid_at'))]).then(x=>{window._allSt=x[3];window._allPay=x[4];return x});const html=pr.map(p=>{const admitted=st.filter(s=>s.promoter_code===p.code);const ids=admitted.map(s=>s.id);const amount=pay.filter(x=>ids.includes(x.student_id)).reduce((sum,x)=>sum+Number(x.amount||0),0);return `<div class="card"><div class="row"><b>${esc(p.name)} (${esc(p.code)})</b></div><div class="muted">Admission count for ${esc(month)}: <b>${admitted.length}</b><br>Payment received from those admissions during selected month: <b>${money(amount)}</b><br>Registration link: <code>${esc(location.origin+'/?promoter='+encodeURIComponent(p.code))}</code></div><div class="btns"><button class="btn sm alt" onclick="copyText('${esc(location.origin+'/?promoter='+p.code)}')">Copy Link</button><button class="btn sm" onclick="openDiscount('promoter','${p.id}')">🏷️ Discount / Deduction</button><button class="btn sm red" onclick="deleteMember('promoter','${p.id}')">Delete ID</button></div>${commBlock(p,month)}${admitted.map(s=>{const sp=pay.filter(x=>x.student_id===s.id);return `<div class="card"><b>${esc(s.name)}</b><div class="muted">Course: ${esc(s.class)} · Admission: ${s.created_at?fmtTime(s.created_at):'Date unavailable'}</div><div class="hist-row"><span>Total payment in ${esc(month)}</span><b>${money(sp.reduce((z,x)=>z+Number(x.amount||0),0))}</b></div>${sp.map(x=>`<div class="hist-row"><span>${x.paid_at?fmtTime(x.paid_at):fmt(x.paid_on)}</span><b>${money(x.amount)}</b></div>`).join('')}</div>`}).join('')}</div>`}).join('');$('#prom-report').innerHTML=html||'<p class="muted">No promoters have been added yet.</p>'}

function commBlock(p,month){
  if(window._pcErr)return '<div class="muted" style="margin-top:.6rem">Commission table missing. Run the commission SQL in Supabase.</div>';
  const all=(window._pc||[]).filter(c=>c.promoter_id===p.id);
  const rows=all.filter(c=>c.paid_month===month);
  const tot=rows.reduce((z,x)=>z+Number(x.amount||0),0), allTot=all.reduce((z,x)=>z+Number(x.amount||0),0);
  const byM={};all.forEach(c=>byM[c.paid_month]=(byM[c.paid_month]||0)+Number(c.amount||0));
  return `<div style="margin-top:.8rem;padding:.7rem;border:1px solid var(--line);border-radius:12px"><b>Commission - ${esc(month)}: ${money(tot)}</b><div class="muted">Total given (all months): ${money(allTot)}</div>
  ${rows.map(c=>`<div class="hist-row"><span>${fmtTime(c.paid_at)}${c.note?' · '+esc(c.note):''}</span><span><b>${money(c.amount)}</b> <button class="btn sm red" onclick="delCommission('${c.id}')">Remove</button></span></div>`).join('')||'<div class="muted">No commission added for this month.</div>'}
  <input id="cm-amt-${p.id}" type="number" min="1" placeholder="Commission amount (₹)"><input id="cm-note-${p.id}" placeholder="Note (optional)"><button class="btn sm" onclick="addCommission('${p.id}')">Add Commission</button>
  <div class="muted" style="margin-top:.5rem">Month-wise: ${Object.keys(byM).sort().reverse().map(m=>esc(m)+' '+money(byM[m])).join(' · ')||'-'}</div></div>`;
}

// ---- per-student commission (all admissions of a promoter) ----
function stuCommRows(p){
  const all=window._pc||[];
  return (window._allSt||[]).filter(s=>String(s.promoter_code||'').toUpperCase()===String(p.code||'').toUpperCase()).map(s=>{
    const paid=(window._allPay||[]).filter(x=>x.student_id===s.id).reduce((z,x)=>z+Number(x.amount||0),0);
    const got=all.filter(c=>c.promoter_id===p.id&&c.student_id===s.id).reduce((z,x)=>z+Number(x.amount||0),0);
    return {s,paid,got};
  });
}
function stuCommBlock(p){
  const rows=stuCommRows(p);const T=k=>rows.reduce((z,r)=>z+r[k],0);
  return `<div style="margin-top:.8rem;padding:.7rem;border:1px solid var(--line);border-radius:12px"><b>Students admitted through ${esc(p.code)} (${rows.length})</b>

  ${rows.map(r=>`<div class="card" style="margin:.4rem 0"><div class="row"><b>${esc(r.s.name)}</b><b class="p">Given ${money(r.got)}</b></div><div class="muted" style="font-size:.78rem">${esc(r.s.class||'')}</div>
  <input id="cs-amt-${r.s.id}" type="number" min="1" placeholder="Commission amount (₹)"><input id="cs-note-${r.s.id}" placeholder="Note (optional)"><button class="btn sm" onclick="payStuCommission('${p.id}','${r.s.id}')">Give Commission</button></div>`).join('')||'<div class="muted">No student has joined with this promoter ID yet.</div>'}</div>`;
}

async function openDiscount(type,id){
  let e,hist;
  try{e=await discEntity(type,id)}catch(_){return}
  const h=await sb.from('discounts').select('*').eq('entity_type',type).eq('entity_id',String(id)).order('created_at',{ascending:false});
  if(h.error) return toast('Discount table is missing. Run supabase_discounts.sql in Supabase first.',8000);
  hist=h.data||[];
  const hasFee=type==='student'||type==='library';
  const pending=hasFee?Math.max(0,e.total-e.paid):null;
  document.getElementById('disc-modal')?.remove();
  const m=document.createElement('div');m.className='modal';m.id='disc-modal';
  m.innerHTML=`<div class="card"><h2 style="margin-top:0">${type==='teacher'||type==='promoter'?'Discount / Deduction':'Discount'}</h2>
   <div class="muted">${DISC_LABEL[type]}: <b>${esc(e.name)}</b>${hasFee?`<br>Current fee: <b>${money(e.total)}</b> · Deposited: <b>${money(e.paid)}</b> · Pending: <b>${money(pending)}</b>`:''}</div>
   <label class="muted">Discount amount (₹)</label><input id="d-amt" type="number" min="1" ${hasFee?`max="${pending}"`:''} placeholder="Amount">
   <label class="muted">Reason (optional)</label><input id="d-reason" placeholder="e.g. Scholarship, special offer">
   <div class="btns"><button class="btn" onclick="applyDiscount('${type}','${id}')">Apply Discount</button><button class="btn alt" onclick="document.getElementById('disc-modal').remove()">Close</button></div>
   <h3>Discount History</h3>${hist.map(d=>`<div class="hist-row"><span>${fmtTime(d.created_at)}<br><span class="muted">${esc(d.reason||'')}</span></span><span><b>${money(d.amount)}</b> <button class="btn sm red" onclick="removeDiscount('${d.id}')">Undo</button></span></div>`).join('')||'<p class="muted">No discounts yet.</p>'}</div>`;
  document.body.appendChild(m);
}
async function applyDiscount(type,id){
  const amt=Number($('#d-amt').value),reason=$('#d-reason').value.trim();
  if(!(amt>0)) return toast('Enter a discount amount.');
  let e;try{e=await discEntity(type,id)}catch(_){return}
  const hasFee=type==='student'||type==='library';
  if(hasFee&&amt>Math.max(0,e.total-e.paid)) return toast('Discount cannot be more than the pending fee ('+money(Math.max(0,e.total-e.paid))+').',6000);
  const ins=await sb.from('discounts').insert({entity_type:type,entity_id:String(id),entity_name:e.name,amount:amt,reason:reason||null,fee_before:hasFee?e.total:null,fee_after:hasFee?e.total-amt:null}).select('id').single();
  if(ins.error) return toast('Could not save discount: '+ins.error.message,8000);
  if(hasFee){
    const u=type==='student'?await sb.from('students').update({total_fees:e.total-amt}).eq('id',id):await sb.from('library_registrations').update({fee_amount:e.total-amt}).eq('id',id);
    if(u.error){await sb.from('discounts').delete().eq('id',ins.data.id);return toast('Could not apply discount: '+u.error.message,7000)}
  }
  toast('Discount of '+money(amt)+' applied.');
  document.getElementById('disc-modal')?.remove();
  refreshAfterDiscount(type);
}
async function removeDiscount(did){
  if(!confirm('Undo this discount? The fee will go back up by this amount.')) return;
  const r=await sb.from('discounts').select('*').eq('id',did).maybeSingle();
  if(r.error||!r.data) return toast('Discount not found.');
  const d=r.data;
  if(d.entity_type==='student'||d.entity_type==='library'){
    const e=await discEntity(d.entity_type,d.entity_id);
    const u=d.entity_type==='student'?await sb.from('students').update({total_fees:e.total+Number(d.amount)}).eq('id',d.entity_id):await sb.from('library_registrations').update({fee_amount:e.total+Number(d.amount)}).eq('id',d.entity_id);
    if(u.error) return toast('Could not undo: '+u.error.message,7000);
  }
  const x=await sb.from('discounts').delete().eq('id',did);
  if(x.error) return toast(x.error.message);
  toast('Discount removed.');document.getElementById('disc-modal')?.remove();refreshAfterDiscount(d.entity_type);
}
function refreshAfterDiscount(type){go(({student:$('#v-fee').classList.contains('hide')?'stu':'fee',library:'lib',teacher:'teach',promoter:'prom'})[type])}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(s)})}
async function loadPdfLibs(){
  if(window.jspdf&&window.jspdf.jsPDF&&window.jspdf.jsPDF.API.autoTable) return;
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
}
const rs=n=>'Rs. '+Number(n||0).toLocaleString('en-IN');
const pt=v=>String(v==null||v===''?'-':v).replace(/[^\x20-\x7E -ÿ]/g,'?');
async function buildPdf(title,head0,rows0,foot0,filename,extras,photos){
  // mobile numbers are never printed in PDFs
  const _mi=head0.indexOf('Mobile');const _k=head0.map((h,i)=>i).filter(i=>i!==_mi);
  const head=_k.map(i=>head0[i]);const rows=rows0.map(r=>_k.map(i=>r[i]));
  const foot=(foot0&&foot0.length===head0.length)?_k.map(i=>foot0[i]):foot0;
  const hasPh=Array.isArray(photos)&&photos.length>0;
  if(hasPh){head.unshift('Photo');rows.forEach((r,ix)=>r.unshift(''));if(foot)foot.unshift('')}
  try{await loadPdfLibs()}catch(e){return toast('PDF tool could not load. Check your internet connection and try again.',7000)}
  const cs=await sb.from('site_settings').select('setting_key,setting_value').in('setting_key',['center_name','center_address','center_phone']);
  const c={};(cs.data||[]).forEach(r=>c[r.setting_key]=r.setting_value);
  const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'landscape',unit:'pt',format:'a4'});
  const W=doc.internal.pageSize.getWidth();
  doc.setFontSize(18);doc.setFont('helvetica','bold');doc.text(pt(c.center_name||'BIIT Computer Institute'),40,40);
  doc.setFontSize(10);doc.setFont('helvetica','normal');
  const sub=[c.center_address,c.center_phone].filter(Boolean).map(pt).join('  |  ');if(sub)doc.text(sub,40,55);
  doc.setFontSize(13);doc.setFont('helvetica','bold');doc.text(title,40,78);
  doc.setFontSize(9);doc.setFont('helvetica','normal');doc.text('Generated: '+fmtTime(new Date())+' (IST)',W-40,78,{align:'right'});
  doc.autoTable({head:[head],body:rows,foot:foot?[foot]:undefined,startY:88,theme:'grid',styles:{fontSize:8,cellPadding:3,overflow:'linebreak'},
    didParseCell:(d)=>{if(hasPh&&d.section==='body'&&d.column.index===0){d.cell.styles.minCellHeight=46;d.cell.styles.cellPadding=2}},
    didDrawCell:(d)=>{if(hasPh&&d.section==='body'&&d.column.index===0){const src=photos[d.row.index];if(src){try{const pr=doc.getImageProperties(src);const k=Math.min(40/pr.width,40/pr.height);const w=pr.width*k,h=pr.height*k;const fmt=/^data:image\/png/.test(src)?'PNG':'JPEG';doc.addImage(src,fmt,d.cell.x+(d.cell.width-w)/2,d.cell.y+(d.cell.height-h)/2,w,h)}catch(_){doc.setFontSize(6);doc.text('No photo',d.cell.x+3,d.cell.y+d.cell.height/2+2)}}else{doc.setFontSize(6);doc.text('No photo',d.cell.x+3,d.cell.y+d.cell.height/2+2)}}},headStyles:{fillColor:[15,61,46],textColor:255},footStyles:{fillColor:[230,236,232],textColor:20,fontStyle:'bold'},margin:{left:30,right:30},
    didDrawPage:()=>{doc.setFontSize(8);doc.text('Page '+doc.internal.getNumberOfPages(),W/2,doc.internal.pageSize.getHeight()-16,{align:'center'})}});
  for(const ex of (extras||[])){
    if(!ex.rows.length) continue;
    let y=(doc.lastAutoTable?doc.lastAutoTable.finalY:88)+28;
    if(y>doc.internal.pageSize.getHeight()-110){doc.addPage();y=40}
    doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text(ex.title,30,y);
    doc.autoTable({head:[ex.head],body:ex.rows,startY:y+8,theme:'grid',styles:{fontSize:8,cellPadding:3},headStyles:{fillColor:[15,61,46],textColor:255},margin:{left:30,right:30},
      didParseCell:d=>{if(d.section==='body'&&ex.boldIf&&ex.boldIf(d.row.raw)){d.cell.styles.fontStyle='bold';d.cell.styles.fillColor=[230,236,232]}}});
  }
  doc.save(filename);toast('PDF downloaded.');
}

async function studentPdf(which){
  toast('Preparing PDF…');

    if(which!=='all')st=st.filter(s=>String(s.id)===String(which));
    if(!st.length)return toast('No student found.');
    const payRows=await ok(sb.from('fee_payments').select('id,student_id,amount,paid_at,paid_on,paid_month,note').order('paid_at',{ascending:true}));
    const dr=await sb.from('discounts').select('entity_id,amount,reason,created_at').eq('entity_type','student');
    const c=await centerInfo();
    const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'portrait',unit:'pt',format:'a4'});const W=doc.internal.pageSize.getWidth();
    st.forEach((s,i)=>{
      if(i>0)doc.addPage();

      const disc=(dr.data||[]).filter(d=>String(d.entity_id)===String(s.id));
      const dsum=disc.reduce((t,d)=>t+Number(d.amount||0),0),net=Number(s.total_fees||0),orig=net+dsum;

      doc.setFont('helvetica','bold');doc.setFontSize(17);doc.text(pt(c.name||'BIIT Computer Institute'),W/2,40,{align:'center'});
      doc.setFont('helvetica','normal');doc.setFontSize(9);
      const sub=[c.address,c.phone].filter(Boolean).map(pt).join('  |  ');if(sub)doc.text(sub,W/2,54,{align:'center'});
      doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('STUDENT DETAILS & FEE REPORT',W/2,76,{align:'center'});
      doc.setFont('helvetica','normal');doc.setFontSize(8);doc.text('Generated: '+fmtTime(new Date())+' (IST)',W-36,90,{align:'right'});
      doc.autoTable({startY:98,theme:'grid',styles:{fontSize:9,cellPadding:4},columnStyles:{0:{fontStyle:'bold',fillColor:[236,241,238],cellWidth:120}},margin:{left:36,right:36},
        body:[['Name',pt(s.name)],['Course',pt(s.class)],['Father',pt(s.father_name)],['Mother',pt(s.mother_name)],['Address',pt(s.address)],['Date of Birth',pt(s.dob)],['Admission',pt(s.created_at?fmtTime(s.created_at):'-')],['Admission Through',pt(s.promoter_code?'Promoter ID: '+s.promoter_code:'Direct')]]});

        head:[['Course Fee','Discount','Net Fee','Deposited','Pending']],body:[[rs(orig),rs(dsum),rs(net),rs(paid),rs(pend)]]});
      const rows=mine.map((p,k)=>[k+1,when(p.paid_at,p.paid_on),pt(p.paid_month),rs(p.amount),pt(p.note),INV.no(p.id,p.paid_at||p.paid_on)]);
      doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text('Fee deposits (date and time in IST)',36,doc.lastAutoTable.finalY+28);
      doc.autoTable({startY:doc.lastAutoTable.finalY+34,theme:'grid',styles:{fontSize:8.5,cellPadding:3.5},headStyles:{fillColor:[15,61,46],textColor:255},margin:{left:36,right:36},
        head:[['#','Date & Time','For Month','Amount','Note','Invoice No']],body:rows.length?rows:[['','No deposits yet','','','','']],
        foot:[['','','TOTAL',rs(paid),'','']],footStyles:{fillColor:[230,236,232],textColor:20,fontStyle:'bold'}});
      if(disc.length){doc.autoTable({startY:doc.lastAutoTable.finalY+14,theme:'grid',styles:{fontSize:8.5,cellPadding:3.5},headStyles:{fillColor:[120,80,10],textColor:255},margin:{left:36,right:36},
        head:[['Discount Date & Time','Amount','Reason']],body:disc.map(d=>[when(d.created_at),rs(d.amount),pt(d.reason)])})}
    });
    const nm=which==='all'?'All-Students':pt(st[0].name).replace(/[^A-Za-z0-9]+/g,'-');
    doc.save('BIIT-'+nm+'-'+today()+'.pdf');toast('PDF downloaded.');
  }catch(e){toast('PDF could not be made: '+(e.message||e),7000)}
}
const when=(ts,d)=>pt(ts?fmtTime(ts):(d?fmt(d):'-'));
async function discSums(type){
  const r=await sb.from('discounts').select('entity_id,amount').eq('entity_type',type);
  const m={};(r.data||[]).forEach(d=>m[d.entity_id]=(m[d.entity_id]||0)+Number(d.amount||0));return m;
}
const sumBy=(rows,k,v)=>{const m={};(rows||[]).forEach(r=>m[r[k]]=(m[r[k]]||0)+Number(r[v]||0));return m};

function optIdx(ch){return 'abcd1234कखगघ'.indexOf(String(ch).toLowerCase())%4}
function parseOcrQuestions(raw){
  // Tolerant parser: handles OCR mistakes (O/l/I instead of 0/1), Hindi digits, missing dots,
  // several questions glued on one line, options on one line "(a) x (b) y", options without ")".
  const HD='०१२३४५६७८९';
  const num=t=>{const v=parseInt(String(t).replace(/[०-९]/g,c=>HD.indexOf(c)).replace(/[OoDQ]/g,'0').replace(/[Il|!]/g,'1'),10);return isNaN(v)?0:v};
  const lines=String(raw||'').replace(/\r/g,'').split('\n').map(l=>l.replace(/[ \t]+/g,' ').trim()).filter(Boolean);
  const OL='A-Da-dकखगघ';
  const qRe=new RegExp('^(?:(?:Q(?:uestion|ue|n)?|प्रश्न)\\.?\\s*)?([0-9०-९OoIl|]{1,3})\\s*[.)\\]:\\-–—]\\s*(\\S.*)$','i');
  const looseRe=/^(?:Q\s*)?(\d{1,3})\s+(\S.{8,})$/i;
  const oRe=new RegExp('^[(\\[]?\\s*(['+OL+'])\\s*[.)\\]:]\\s*(.*)$');
  const oOpenRe=new RegExp('^\\(\\s*(['+OL+'])\\s+(\\S.*)$');
  const o2Re=/^\(\s*([1-4])\s*\)\s*(.*)$/;
  const ansRe=/^(?:ans(?:wer)?|उत्तर|correct)\s*[:.\-)]*\s*\(?\s*([A-Da-d1-4कखगघ])\s*\)?/i;
  const OLI=OL+'1-4';
  const inlineRe=new RegExp('\\(\\s*(['+OLI+'])\\s*\\)','g');
  const out=[];let cur=null,kind=null,lastNum=0,lastOpt=-1;
  const setOpt=(k,t)=>{cur.options[k]=(cur.options[k]?cur.options[k]+' ':'')+t.trim();lastOpt=k;kind='o'};
  const addInline=text=>{
    const parts=text.split(new RegExp('\\(\\s*(['+OLI+'])\\s*\\)'));
    if(parts.length>=5){for(let i=1;i<parts.length;i+=2){const t=(parts[i+1]||'').trim();if(t)setOpt(optIdx(parts[i]),t)}return true}
    return false};
  const startQ=(n,text)=>{
    if(cur)out.push(cur);
    cur={num:n,question:text.trim(),options:[],answer:null};kind='q';lastNum=n;lastOpt=-1;
    const p=cur.question.search(new RegExp('\\(\\s*[Aa1]\\s*\\)'));
    if(p>0&&(cur.question.match(inlineRe)||[]).length>=2){const t=cur.question.slice(p);cur.question=cur.question.slice(0,p).trim();addInline(t)}
  };
  const queue=lines.slice();
  while(queue.length){
    let line=queue.shift();let m;
    // several questions glued in one line: "... (d) xyz 11. next question"
    if(cur||qRe.test(line)){
      const qm=line.match(qRe),qn=qm?num(qm[1]):0,base=(qn>lastNum&&qn<=lastNum+6)?qn:lastNum;
      const nx=base+1,mm=line.match(new RegExp('^(.{10,}?)\\s+'+nx+'\\s*[.)]\\s+(\\S.*)$'));
      if(mm){queue.unshift(nx+'. '+mm[2]);line=mm[1]}
    }
    if((m=line.match(ansRe))&&cur&&cur.options.filter(Boolean).length){cur.answer=optIdx(m[1]);continue}
    if(cur&&(line.match(inlineRe)||[]).length>=2&&/^[(\[]?\s*[A-Da-dकखगघ]\s*[)\]]/.test(line)){if(addInline(line))continue}
    if(cur&&(m=line.match(oRe))&&!(cur.options.filter(Boolean).length>=4&&optIdx(m[1])===0)){setOpt(optIdx(m[1]),m[2]);continue}
    if(cur&&(m=line.match(oOpenRe))){setOpt(optIdx(m[1]),m[2]);continue}
    if(cur&&(m=line.match(o2Re))){setOpt(Number(m[1])-1,m[2]);continue}
    if((m=line.match(qRe))){
      const n=num(m[1]);
      if(n>=1&&n<=300&&(!cur||(n>lastNum&&n<=lastNum+6)||cur.options.filter(Boolean).length>=2)){startQ(n,m[2]);continue}
    }
    // number without a dot, but it is exactly the next number and previous question looks finished
    if(cur&&cur.options.filter(Boolean).length>=2&&(m=line.match(looseRe))&&Number(m[1])===lastNum+1){startQ(Number(m[1]),m[2]);continue}
    if(cur){if(kind==='o'&&lastOpt>=0)cur.options[lastOpt]+=' '+line;else cur.question+=' '+line}
  }
  if(cur)out.push(cur);
  out.forEach(q=>{q.options=Array.from(q.options,o=>o||'')});
  return out.filter(q=>q.question.length>3);
}

async function prepOcrImage(file,mode){
  // mode 'gray': grayscale + contrast stretch (best for printed Hindi/English photos)
  // mode 'bw'  : adaptive black/white (helps shadows and uneven light)
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    let w=img.naturalWidth,h=img.naturalHeight;const target=Math.min(Math.max(w,2000),3000),k=target/w;w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.fillRect(0,0,w,h);x.imageSmoothingQuality='high';x.drawImage(img,0,0,w,h);
    const im=x.getImageData(0,0,w,h),d=im.data,g=new Uint8Array(w*h);
    for(let i=0,j=0;i<d.length;i+=4,j++)g[j]=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)|0;
    if(mode==='gray'){
      const hist=new Uint32Array(256);for(let j=0;j<g.length;j++)hist[g[j]]++;
      let lo=0,hi=255,acc=0;const n=g.length;
      for(let v=0;v<256;v++){acc+=hist[v];if(acc>n*0.01){lo=v;break}}
      acc=0;for(let v=255;v>=0;v--){acc+=hist[v];if(acc>n*0.15){hi=v;break}}   // paper is the bright majority
      if(hi-lo<40){lo=0;hi=255}
      const sc=255/(hi-lo);
      for(let i=0,j=0;i<d.length;i+=4,j++){const v=Math.max(0,Math.min(255,((g[j]-lo)*sc)|0));d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}
      x.putImageData(im,0,0);return c;
    }
    const W1=w+1,I=new Float64Array(W1*(h+1));
    for(let y=0;y<h;y++){let row=0;for(let x2=0;x2<w;x2++){row+=g[y*w+x2];I[(y+1)*W1+x2+1]=I[y*W1+x2+1]+row}}
    const r=Math.max(15,Math.round(w/30));
    for(let y=0;y<h;y++){const y0=Math.max(0,y-r),y1=Math.min(h-1,y+r);for(let x2=0;x2<w;x2++){const x0=Math.max(0,x2-r),x1=Math.min(w-1,x2+r);
      const n=(x1-x0+1)*(y1-y0+1),sum=I[(y1+1)*W1+x1+1]-I[y0*W1+x1+1]-I[(y1+1)*W1+x0]+I[y0*W1+x0];
      const v=g[y*w+x2]*n<sum*0.93?0:255;const o=(y*w+x2)*4;d[o]=d[o+1]=d[o+2]=v;d[o+3]=255}}
    x.putImageData(im,0,0);return c;
  }finally{URL.revokeObjectURL(url)}
}

async function photoToJpegB64(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const k=Math.min(1,1100/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',0.72).split(',')[1];
  }finally{URL.revokeObjectURL(url)}
}
async function aiReadPhotos(files,st){
  try{
    const list=Array.from(files),all=[],keys=[];
    const sleep=ms=>new Promise(r=>setTimeout(r,ms));
    for(let fi=0;fi<list.length;fi++){
      const f=list[fi],many=list.length>1;

      let img;
      if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
        if(f.size>10*1024*1024){toast('PDF is too big (max 10 MB). Please split it.',7000);return window._auto?{qs:[],text:'',failed:true}:null}
        const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});

      let data,error;

        ({data,error}=await sb.functions.invoke('photo-questions',{body:{images:[img]}}));
        const m=JSON.stringify((data&&data.error)||'')+(error&&error.message||'');
        if(!(error||(data&&data.error))||!/high demand|overloaded|busy|try again|429|503|compute resources|idle timeout|timeout|resources/i.test(m))break;
        if(t<2){st.textContent=(many?`Photo ${fi+1}/${list.length}: `:'')+'AI server is busy, trying again… ('+(t+2)+'/3)';await sleep(8000)}
      }
      if(error||!data||data.error||!Array.isArray(data.questions)){
        let why=(data&&data.error)||(error&&error.message)||'no reply';
        try{if(error&&error.context&&error.context.json){const j=await error.context.json();if(j&&(j.error||j.message))why=j.error||j.message}}catch(_){}
        console.warn('AI reader unavailable:',why);
        const busyNow=/high demand|overloaded|busy|try again/i.test(why);
        const short=(many?`Photo ${fi+1}: `:'')+(busyNow?'Google AI is busy right now. Please try again in a few minutes.':String(why).slice(0,180));
        if(window._auto||many){toast(short+(many?' Nothing was saved.':''),9000);return {qs:[],text:'',failed:true}}
        toast('AI reader problem: '+short+'  (using the basic reader instead)',9000);return null;
      }
      data.questions.forEach((q,i)=>all.push({q,fi,i}));
      (data.answer_key||[]).forEach(k=>keys.push(k));
    }
    const norm=t=>String(t||'').toLowerCase().replace(/[^a-z0-9\u0900-\u097f]/g,'').slice(0,30);
    const optN=o=>(o.q.options||[]).filter(Boolean).length;
    let res=[];
    all.filter(x=>x.q&&String(x.q.question||'').trim().length>2).forEach(x=>{
      const it={fi:x.fi,i:x.i,q:x.q,n:parseInt(x.q.num,10)||null,k:norm(x.q.question)};
      const dup=res.findIndex(r=>r.k===it.k||(it.n!==null&&r.n===it.n&&r.k.slice(0,12)===it.k.slice(0,12)));
      if(dup>=0){if(optN(it)>optN(res[dup]))res[dup]=it;return}
      res.push(it);
    });
    // order: by printed question number when numbers are clean, otherwise reading order
    const nums=res.filter(r=>r.n!==null).map(r=>r.n);
    const clean=nums.length>0&&new Set(nums).size===nums.length;
    if(clean){let last=0;res.forEach(r=>{r.e=r.n!==null?r.n:last+0.001;last=r.e});res.sort((a,b)=>a.e-b.e||a.fi-b.fi||a.i-b.i)}

    });

  }catch(e){console.warn('AI reader failed',e);toast('AI reader could not start: '+(e.message||e)+'  (using the basic reader instead)',9000);return null}
}

   return `<div class="card"><div class="row"><b>${esc(e.title)}</b><span class="muted">${state}</span></div><div class="muted">${fmtTime(e.start_at)} → ${fmtTime(e.end_at)}<br>${e.duration_min} min · ${e.total_marks} marks (pass ${e.pass_marks}) · ${(e.question_ids||[]).length} questions · ${({both:'All students',student:'Computer students',library_student:'Library students'})[e.audience]}<br>Results: ${e.result_mode==='instant'?'shown immediately':(e.results_declared?'declared':'not declared yet')}</div>
   <div class="row" style="margin:.4rem 0"><span class="muted">Student photo</span><select style="width:auto;margin:0" onchange="exSetPhoto('${e.id}',this.value)">${[['off','Off'],['optional','Optional'],['required','Required']].map(o=>`<option value="${o[0]}" ${photoModeOf(e.instructions)===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
   <div class="btns"><button class="btn sm" onclick="exResults('${e.id}')">Results</button><button class="btn sm alt" onclick="exAccess('${e.id}')">Student access</button><button class="btn sm alt" onclick="exToggle('${e.id}','published',${!e.published})">${e.published?'Unpublish':'Publish'}</button>${e.result_mode==='declared'?`<button class="btn sm alt" onclick="exToggle('${e.id}','results_declared',${!e.results_declared})">${e.results_declared?'Hide Results':'Declare Results'}</button>`:''}<button class="btn sm alt" onclick="exToggle('${e.id}','show_past',${!e.show_past})">${e.show_past?'Hide questions from website':'Show questions on website'}</button><button class="btn sm red" onclick="exDelete('${e.id}')">Delete</button></div></div>`}).join('')||'<p class="muted">No exams yet. Create one first.</p>';
}
async function exDeleteEmpty(){const ids=EXAMS.filter(e=>!(e.question_ids||[]).length).map(e=>e.id);if(!ids.length)return;if(!confirm('Delete '+ids.length+' exam(s) that have no questions?'))return;const {error}=await sb.from('exams').delete().in('id',ids);if(error)return toast(error.message);toast('Empty exams deleted.');exList()}
async function exSetPhoto(id,m){const e=EXAMS.find(x=>x.id===id);if(!e)return;const {error}=await sb.from('exams').update({instructions:withPhoto(e.instructions,m)}).eq('id',id);if(error)return toast(error.message);toast('Photo setting saved.');exList()}
async function exToggle(id,k,v){const {error}=await sb.from('exams').update({[k]:v}).eq('id',id);if(error)return toast(error.message);toast('Updated.');exList()}

let EXRES=[],EXCUR=null;
const cwu=a=>{const d=a.detail||[];const c=k=>d.filter(x=>x.status===k).length;return a.status==='in_progress'?'':'Correct: <b>'+c('correct')+'</b> · Wrong: <b>'+c('wrong')+'</b> · Not answered: <b>'+c('unanswered')+'</b>'+(c('pending')?' · To check: <b>'+c('pending')+'</b>':'')};
async function attemptSelfie(a){
  if(a.answers&&a.answers.__selfie)return a.answers.__selfie;
  if(a.user_id){const l=await sb.storage.from('exam-answers').list(a.user_id+'/'+a.id,{limit:50,search:'selfie'});if(!l.error&&l.data&&l.data.length){const n=l.data.map(x=>x.name).sort().pop();return a.user_id+'/'+a.id+'/'+n}}
  return null;
}
async function showSelfie(a,pre,size){
  pre=pre||'sf-';size=size||56;const el=document.getElementById(pre+a.id);if(!el)return;
  try{if(a.answers&&a.answers.__selfie_data){el.outerHTML=`<a href="${a.answers.__selfie_data}" target="_blank" style="float:right;margin-left:.5rem"><img src="${a.answers.__selfie_data}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;background:#eee"></a>`;return}
    const path=await attemptSelfie(a);if(!path){el.textContent='No photo';return}
    const u=await sb.storage.from('exam-answers').createSignedUrl(path,3600);if(u.error||!u.data){el.textContent='No photo';return}
    el.outerHTML=`<a href="${u.data.signedUrl}" target="_blank" style="float:right;margin-left:.5rem"><img src="${u.data.signedUrl}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;background:#eee"></a>`}
  catch(_){el.textContent='No photo'}
}
async function exResults(id){
  EXCUR=EXAMS.find(x=>x.id===id);const r=await ok(sb.from('exam_attempts').select('*').eq('exam_id',id).order('score',{ascending:false}));EXRES=r;
  const done=r.filter(a=>a.status!=='in_progress'),avg=done.length?done.reduce((t,a)=>t+Number(a.score||0),0)/done.length:0,passed=done.filter(a=>Number(a.score)>=Number(EXCUR.pass_marks)).length;
  $('#ex-body').innerHTML=`<button class="btn sm alt" onclick="exList()">← Back</button><h3>${esc(EXCUR.title)} — Results</h3>
  <div class="grid"><div>Attempts<b>${r.length}</b></div><div>Passed<b>${passed}</b></div><div>Average<b>${avg.toFixed(1)}</b></div></div>
  <div class="btns" style="margin:.6rem 0"><button class="btn sm" onclick="exResultsPdf()">📄 Download Results PDF</button></div>
  ${r.map((a,i)=>`<div class="card">${photoModeOf(EXCUR.instructions)!=='off'?`<span id="sf-${a.id}" class="muted" style="float:right;margin-left:.5rem;font-size:.75rem">…</span>`:''}<div class="row"><b>${i+1}. ${esc(a.student_name||'-')}</b><b>${Number(a.score)}/${EXCUR.total_marks}</b></div><div class="muted">${esc(a.student_phone||'')} · ${a.role==='library_student'?'Library':'Computer'} student · ${a.status==='in_progress'?'In progress':(a.status==='auto_submitted'?'Auto-submitted':'Submitted')}<br>Started: ${a.started_at?fmtTime(a.started_at):'-'}${a.submitted_at?' · Finished: '+fmtTime(a.submitted_at):''}<br>${cwu(a)}<br>${a.status!=='in_progress'?(Number(a.score)>=Number(EXCUR.pass_marks)?'<b style="color:#168a56">PASS</b>':'<b style="color:#c0392b">FAIL</b>'):''} · Tab-switch warnings: ${a.violations}</div>
  ${a.status!=='in_progress'?`<div class="btns"><button class="btn sm" onclick="exGrade('${a.id}')">Check Answers${(a.detail||[]).some(d=>d.status==='pending')?' / Give Marks':''}</button></div>`:''}</div>`).join('')||'<p class="muted">No student has started this exam yet.</p>'}`;
  r.forEach(a=>showSelfie(a));
}
async function blobToDataUrl(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('read'));r.readAsDataURL(b)})}
async function examPhotoSrc(a){
  // 1) small copy saved with the attempt when the exam started (most reliable)
  const _copy=a.answers&&(a.answers.__selfieData||a.answers.__selfie_data);
  if(_copy)return _copy;
  try{
    const path=await attemptSelfie(a);if(!path)return null;
    const d=await sb.storage.from('exam-answers').download(path);
    if(!d.error&&d.data)return await blobToDataUrl(d.data);
    console.warn('photo download failed',path,d.error&&d.error.message);
    const su=await sb.storage.from('exam-answers').createSignedUrl(path,600);
    if(su.error||!su.data)return null;
    try{const resp=await fetch(su.data.signedUrl);if(resp.ok)return await blobToDataUrl(await resp.blob())}catch(_){}
    return await new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{try{const c=document.createElement('canvas');c.width=Math.min(480,im.naturalWidth);c.height=Math.round(im.naturalHeight*c.width/im.naturalWidth);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))}catch(_){res(null)}};im.onerror=()=>res(null);im.src=su.data.signedUrl})
  }catch(e){console.warn('photo error',e);return null}
}
async function exResultsPdf(){
  const e=EXCUR;toast('Preparing PDF with student photos…',3000);
  const pr=await sb.from('exam_photos').select('attempt_id,photo').in('attempt_id',EXRES.map(a=>a.id));
  if(pr.error)console.warn('exam_photos read failed',pr.error);
  const PM={};(pr.data||[]).forEach(x=>PM[String(x.attempt_id)]=x.photo);
  const photos=[];for(const a of EXRES){photos.push(PM[String(a.id)]||await examPhotoSrc(a))}
  const found=photos.filter(Boolean).length;toast('Photos found: '+found+' of '+EXRES.length+(pr.error?' (photo table error: '+pr.error.message+')':'')+(found<EXRES.length?' - others show "No photo"':''),9000);const cnt=(a,k)=>(a.detail||[]).filter(x=>x.status===k).length;const rows=EXRES.map((a,i)=>[i+1,pt(a.student_name),pt(a.student_phone),a.role==='library_student'?'Library':'Computer',Number(a.score),e.total_marks,cnt(a,'correct'),cnt(a,'wrong'),a.status==='in_progress'?'-':(Number(a.score)>=Number(e.pass_marks)?'PASS':'FAIL'),a.violations,a.started_at?when(a.started_at):'-',a.submitted_at?when(a.submitted_at):'-']);
  buildPdf('Exam Results - '+pt(e.title)+' (Total marks '+e.total_marks+', Pass '+e.pass_marks+')',['#','Name','Mobile','Type','Score','Out of','Correct','Wrong','Result','Warnings','Started (IST)','Submitted (IST)'],rows,null,'BIIT-Exam-'+today()+'.pdf',null,photos);
}
async function exGrade(aid){
  const a=EXRES.find(x=>x.id===aid);const d=a.detail||[];
  const items=await Promise.all(d.map(async(q,i)=>{
    let ans='',bc='';
    if(q.qtype==='subjective'){const g=q.given||{};let img='';if(g.photo){const s=await sb.storage.from('exam-answers').createSignedUrl(g.photo,600);if(s.data)img=`<br><a href="${s.data.signedUrl}" target="_blank"><img src="${s.data.signedUrl}" style="max-width:100%;border-radius:10px;margin-top:.4rem"></a>`}
      ans=`<div class="muted">Student's answer:</div><div style="white-space:pre-wrap">${esc(g.text||'(no text)')}</div>${img}<label class="muted">Marks (out of ${q.marks})</label><input id="gm-${i}" type="number" min="0" max="${q.marks}" step="0.5" value="${q.awarded??''}">`}
    else{const o=q.options||[];bc=q.status==='correct'?'#168a56':q.status==='wrong'?'#c0392b':'#c98a00';ans=`<div class="muted">Student: <b>${q.given==null?'Not answered':LET[q.given]+'. '+esc(o[q.given])}</b><br>Correct: <b style="color:#168a56">${LET[q.correct]}. ${esc(o[q.correct])}</b> · <b style="color:${bc}">${q.status==='correct'?'✓ Correct':q.status==='wrong'?'✗ Wrong':'Not answered'}</b> (${q.awarded} marks)</div>`}
    return `<div class="card" ${bc?`style="border-left:5px solid ${bc}"`:''}><b>Q${i+1}. ${esc(q.question)}</b>${ans}</div>`}));
  const m=document.createElement('div');m.className='modal';m.id='grade-modal';
  m.innerHTML=`<div class="card">${photoModeOf(EXCUR.instructions)!=='off'?`<span id="sg-${a.id}" class="muted" style="float:right;font-size:.75rem">…</span>`:''}<h3 style="margin-top:0">${esc(a.student_name)} — ${a.score}/${EXCUR.total_marks}</h3><div class="muted" style="margin-bottom:.5rem">${cwu(a)}</div>${items.join('')}<div class="btns"><button class="btn" onclick="saveGrade('${aid}')">Save Marks</button><button class="btn alt" onclick="document.getElementById('grade-modal').remove()">Close</button></div></div>`;
  document.body.appendChild(m);showSelfie(a,'sg-',110);
}
async function saveGrade(aid){
  const a=EXRES.find(x=>x.id===aid);const d=JSON.parse(JSON.stringify(a.detail||[]));const manual={};let sum=0;
  for(let i=0;i<d.length;i++){if(d[i].qtype!=='subjective')continue;const v=$('#gm-'+i).value;if(v==='')continue;const mk=Math.max(0,Math.min(Number(v),Number(d[i].marks)));d[i].awarded=mk;d[i].status='graded';manual[d[i].id]=mk}
  d.forEach(q=>{if(q.qtype==='subjective'&&q.awarded!=null)sum+=Number(q.awarded)});
  const {error}=await sb.from('exam_attempts').update({detail:d,manual,score:Number(a.auto_score)+sum}).eq('id',aid);
  if(error)return toast('Could not save: '+error.message,7000);
  toast('Marks saved.');document.getElementById('grade-modal')?.remove();exResults(a.exam_id);
}

const INTRO_STYLES=[['rise','Rise up (letters fly in)'],['zoom','Zoom in'],['slide','Slide in'],['glow','Neon glow'],['type','Typewriter']];
async function viewIntro(){
  const c=await getCfg();const on=c.intro_enabled!=='0';
  const text=c.intro_text||'WELCOME TO BIIT COMPUTER INSTITUTE',sub=('intro_sub' in c)?c.intro_sub:'We Make Success';
  const style=c.intro_style||'rise',type=c.intro_media_type||'none',url=c.intro_media||'',dur=c.intro_duration||'6',mode=c.intro_mode||'session';
  window._introUrl=url;window._introType=type;
  $('#v-intro').innerHTML=`<h2>Welcome Screen</h2><div class="card"><div class="muted">This animated screen plays when someone opens the website or app, before the login page.</div>
  <label style="display:flex;gap:.5rem;align-items:center;margin:.7rem 0"><input type="checkbox" id="in-on" ${on?'checked':''} style="width:auto;margin:0"> <b>Show the welcome screen</b></label>
  <label class="muted">Main text</label><input id="in-text" value="${esc(text)}">
  <label class="muted">Small line under it (optional)</label><input id="in-sub" value="${esc(sub)}">
  <label class="muted">Text animation</label><select id="in-style">${INTRO_STYLES.map(x=>`<option value="${x[0]}" ${x[0]===style?'selected':''}>${x[1]}</option>`).join('')}</select>
  <label class="muted">Background</label><select id="in-type" onchange="introTypeChanged()"><option value="none" ${type==='none'?'selected':''}>Built-in moving colours (uses your website colours)</option><option value="image" ${type==='image'?'selected':''}>My picture (slowly zooms)</option><option value="video" ${type==='video'?'selected':''}>My video</option></select>
  <div id="in-file-box"></div>
  <div class="g3"><div><label class="muted">Show for (seconds)</label><input id="in-dur" type="number" min="2" max="60" value="${esc(dur)}"></div><div style="grid-column:span 2"><label class="muted">When to show</label><select id="in-mode"><option value="session" ${mode==='session'?'selected':''}>Once each time the site is opened</option><option value="always" ${mode==='always'?'selected':''}>Every page load</option></select></div></div>
  <p class="muted">With a video, the screen closes when the video ends (or after the seconds above). Keep videos short (5–15 seconds) and under 50 MB.</p>
  <div class="btns"><button class="btn" onclick="saveIntro()">Save</button><button class="btn alt" onclick="previewIntro()">▶ Preview</button><button class="btn alt" onclick="resetIntro()">Reset to Default</button></div></div>`;
  introTypeChanged();
}
function introTypeChanged(){
  const t=$('#in-type').value,box=$('#in-file-box');
  if(t==='none'){box.innerHTML='';return}
  const has=window._introUrl&&window._introType===t;
  box.innerHTML=`<label class="muted">${t==='video'?'Upload a video (MP4 / WebM)':'Upload a picture'}</label>${has?(t==='video'?`<video src="${esc(window._introUrl)}" muted playsinline controls style="width:100%;border-radius:12px;margin:.3rem 0"></video>`:`<img src="${esc(window._introUrl)}" style="width:100%;border-radius:12px;margin:.3rem 0">`)+'<div class="muted">Current file shown above. Choose a new one to replace it.</div>':''}<input id="in-file" type="file" accept="${t==='video'?'video/mp4,video/webm,video/*':'image/*'}">`;
}
async function saveIntro(){
  const t=$('#in-type').value;let url=window._introUrl||'';const f=$('#in-file')?.files?.[0];
  if(t!=='none'&&f){
    if(t==='video'&&!f.type.startsWith('video/'))return toast('Select a video file.');
    if(t==='image'&&!f.type.startsWith('image/'))return toast('Select a picture.');
    if(f.size>50*1024*1024)return toast('The file must be smaller than 50 MB.');
    toast('Uploading… please wait',60000);
    const path='intro/'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const up=await sb.storage.from('site-media').upload(path,f,{upsert:false,contentType:f.type});
    if(up.error)return toast('Upload failed: '+up.error.message,8000);
    url=sb.storage.from('site-media').getPublicUrl(path).data.publicUrl;
  }
  if(t!=='none'&&!url)return toast('Choose a '+(t==='video'?'video':'picture')+' first, or pick the built-in background.');
  const dur=Math.max(2,Math.min(60,Number($('#in-dur').value)||6));
  const kv=[['intro_enabled',$('#in-on').checked?'1':'0'],['intro_text',($('#in-text').value.trim()||'WELCOME TO BIIT COMPUTER INSTITUTE')],['intro_sub',$('#in-sub').value.trim()],['intro_style',$('#in-style').value],['intro_media_type',t],['intro_media',t==='none'?'':url],['intro_duration',String(dur)],['intro_mode',$('#in-mode').value]];
  for(const [k,v] of kv){const {error}=await sb.from('site_settings').upsert({setting_key:k,setting_value:v},{onConflict:'setting_key'});if(error)return toast('Could not save: '+error.message,7000)}
  toast('Welcome screen saved.');viewIntro();
}
function previewIntro(){window.open(location.origin+'/?intro=preview','_blank')}
async function resetIntro(){

  for(const [k,v] of [['intro_enabled','1'],['intro_text','WELCOME TO BIIT COMPUTER INSTITUTE'],['intro_sub','We Make Success'],['intro_style','rise'],['intro_media_type','none'],['intro_media',''],['intro_duration','6'],['intro_mode','session']]){await sb.from('site_settings').upsert({setting_key:k,setting_value:v},{onConflict:'setting_key'})}

async function viewMedia(){const settings=await ok(sb.from('site_settings').select('*'));const cfg={};settings.forEach(s=>cfg[s.setting_key]=s.setting_value);const media=await ok(sb.from('site_media').select('*').order('created_at',{ascending:false}).limit(100));$('#v-media').innerHTML=`<h2>Website Content</h2><div class="card"><b>Website Logo</b><p class="muted">Upload any PNG, JPG, WEBP or SVG logo (any shape, up to 25 MB; 512 × 512 px or larger looks sharpest). It replaces the logo on the student website and this panel.</p><input id="logofile" type="file" accept="image/*,application/pdf"><div class="btns"><button class="btn" onclick="uploadLogo()">Upload Logo</button><button class="btn sm alt" onclick="resetLogo()">Use Default Logo</button></div></div><div class="card"><b>Social Media Links</b><label class="muted">YouTube URL</label><input id="yt" type="url" placeholder="https://youtube.com/@yourchannel" value="${esc(cfg.youtube_url||'')}"><label class="muted">Instagram URL</label><input id="ig" type="url" placeholder="https://instagram.com/yourprofile" value="${esc(cfg.instagram_url||'')}"><label class="muted">WhatsApp group URL</label><input id="wa" type="url" placeholder="https://chat.whatsapp.com/..." value="${esc(cfg.whatsapp_url||'')}"><button class="btn" onclick="saveSiteLinks()">Save Links</button></div><div class="card"><b>Upload Banner or Gallery Image</b><label class="muted">Content Type</label><select id="mtype"><option value="banner">Website Banner</option><option value="gallery">Gallery Image</option></select><label class="muted">Caption (optional)</label><input id="mcaption" placeholder="Caption"><input id="mfile" type="file" accept="image/*,application/pdf"><button class="btn" onclick="uploadSiteMedia()">Upload Image</button><p class="muted">For a full-width HD slider, upload banners at 1920 × 1080 px (16:9). Several banners slide automatically.</p><p class="muted">Images are stored in the Supabase Storage bucket configured by the setup SQL.</p></div><h3>Uploaded Content</h3><div id="media-list">${media.map(m=>`<div class="card row"><span><b>${esc(m.media_type)}</b><br><span class="muted">${esc(m.caption||m.file_name||'')}</span></span><button class="btn sm red" onclick="deleteSiteMedia('${m.id}')">Delete</button></div>`).join('')||'<p class="muted">No uploaded images.</p>'}</div>`}
async function saveSiteLinks(){const yt=$('#yt').value.trim(),ig=$('#ig').value.trim(),wa=($('#wa')||{value:''}).value.trim();for(const [key,value] of [['youtube_url',yt],['instagram_url',ig],['whatsapp_url',wa]]){const {error}=await sb.from('site_settings').upsert({setting_key:key,setting_value:value},{onConflict:'setting_key'});if(error)return toast('Could not save links: '+error.message)}toast('Website links saved.');}
async function uploadSiteMedia(){const file=$('#mfile').files[0],type=$('#mtype').value,caption=$('#mcaption').value.trim();if(!file)return toast('Choose an image first.');if(!file.type.startsWith('image/'))return toast('Select an image file.');if(file.size>25*1024*1024)return toast('Image must be smaller than 25 MB.');const path=`${type}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const up=await sb.storage.from('site-media').upload(path,file,{upsert:false,contentType:file.type});if(up.error)return toast('Upload failed: '+up.error.message,7000);const pub=sb.storage.from('site-media').getPublicUrl(path).data.publicUrl;const {error}=await sb.from('site_media').insert({media_type:type,storage_path:path,public_url:pub,caption:caption||null,file_name:file.name,is_active:true});if(error)return toast('Image uploaded but metadata save failed: '+error.message,7000);toast('Image uploaded.');viewMedia()}
async function deleteSiteMedia(id){if(!confirm('Delete this website image?'))return;const {data,error}=await sb.from('site_media').select('storage_path').eq('id',id).maybeSingle();if(error)return toast(error.message);if(data?.storage_path){const r=await sb.storage.from('site-media').remove([data.storage_path]);if(r.error)return toast('Storage delete failed: '+r.error.message)}const d=await sb.from('site_media').delete().eq('id',id);if(d.error)return toast(d.error.message);toast('Image deleted.');viewMedia()}

sb.auth.onAuthStateChange(ev=>{
  if(ev==='PASSWORD_RECOVERY'){sb.auth.signOut();return}
  if(ev==='INITIAL_SESSION')return;
  // the same browser can hold only one login: if another tab logs in as a student, stop the admin screen
  setTimeout(async()=>{
    try{
      const app=$('#app');if(!app||app.classList.contains('hide'))return;
      if(ev==='SIGNED_OUT'){only('login');return}
      const {data:st}=await sb.rpc('is_staff');
      if(!st){only('login');toast('This browser is now logged in as another user (for example a student). Please log in as admin again.',9000)}
    }catch(_){}
  },0);
});
if(recovering){sb.auth.signOut()}
else sb.auth.getSession().then(({data})=>{if(data.session)start()});

<script id="biit-sidebar-controls">
function biitToggleSidebar(force){const open=typeof force==='boolean'?force:!document.body.classList.contains('biit-sidebar-open');document.body.classList.toggle('biit-sidebar-open',open)}
function biitCompactSidebar(){if(window.matchMedia('(max-width:760px)').matches){biitToggleSidebar()}else{document.body.classList.toggle('biit-sidebar-compact')}}
(function(){const links=[...document.querySelectorAll('#biit-side-links [data-view]')];const origGo=window.go; if(typeof origGo==='function'){window.go=async function(v){const out=await origGo.apply(this,arguments);links.forEach(b=>b.classList.toggle('active',b.dataset.view===v||(v==='stu'&&b.dataset.view==='hub')));biitToggleSidebar(false);return out}}const toggle=document.querySelector('#app>.top header');if(toggle){toggle.addEventListener('click',function(e){if(e.target===toggle && window.matchMedia('(max-width:760px)').matches)biitToggleSidebar()});const brand=toggle.querySelector('.brand');if(brand){brand.style.cursor='pointer';brand.addEventListener('click',function(e){if(window.matchMedia('(max-width:760px)').matches){e.preventDefault();biitToggleSidebar()}})}}})();
</script>
</body>
</html>
